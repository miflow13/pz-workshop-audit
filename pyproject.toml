[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pzaudit"
version = "0.2.0"
description = "Project Zomboid Steam Workshop census and provenance audit tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pzaudit = "pzaudit.cli:main"
pzaudit-review = "pzaudit.review_cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
